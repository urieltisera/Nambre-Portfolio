services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.production or the shell}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.production or the shell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.production or the shell}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
    volumes:
      - backend_storage:${STORAGE_PATH:-/data/storage}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  migrate:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    profiles:
      - migration
    restart: "no"
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
        FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL via --env-file .env.production or the shell}
        SITE_URL: ${SITE_URL:-${FRONTEND_BASE_URL}}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${FRONTEND_BASE_URL}}
        NEXT_PUBLIC_ACCESS_REQUEST_URL: ${NEXT_PUBLIC_ACCESS_REQUEST_URL:-}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL via --env-file .env.production or the shell}
      SITE_URL: ${SITE_URL:-${FRONTEND_BASE_URL}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${FRONTEND_BASE_URL}}
      NEXT_PUBLIC_ACCESS_REQUEST_URL: ${NEXT_PUBLIC_ACCESS_REQUEST_URL:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  backend_storage:
