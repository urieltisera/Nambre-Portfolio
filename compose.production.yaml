services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL via --env-file .env.production or the shell}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
    volumes:
      - backend_storage:${STORAGE_PATH:-/data/storage}
    ports:
      - "127.0.0.1:8000:8000"

  migrate:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    profiles:
      - migration
    restart: "no"
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL via --env-file .env.production or the shell}
    command: ["alembic", "upgrade", "head"]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
        FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL via --env-file .env.production or the shell}
        SITE_URL: ${SITE_URL:-${FRONTEND_BASE_URL}}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${FRONTEND_BASE_URL}}
        NEXT_PUBLIC_ACCESS_REQUEST_URL: ${NEXT_PUBLIC_ACCESS_REQUEST_URL:-}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL via --env-file .env.production or the shell}
      SITE_URL: ${SITE_URL:-${FRONTEND_BASE_URL}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${FRONTEND_BASE_URL}}
      NEXT_PUBLIC_ACCESS_REQUEST_URL: ${NEXT_PUBLIC_ACCESS_REQUEST_URL:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  backend_storage:
