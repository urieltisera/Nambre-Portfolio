services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menuflow}
      POSTGRES_USER: ${POSTGRES_USER:-menuflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menuflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menuflow} -d ${POSTGRES_DB:-menuflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-menuflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-menuflow-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://menuflow:menuflow@postgres:5432/menuflow
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      STORAGE_PATH: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1|10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2})(?::\d+)?$}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
        FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_storage:

